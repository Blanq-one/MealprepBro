[project]
name = "mealbro-backend"
version = "0.0.0"
description = "Mealbro: personal meal-prep and grocery optimizer (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",  # CLAUDE.md stack: SQLAlchemy 2.0
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.32",
    "pulp>=3.3,<4",  # PuLP 4 moved CBC into the separate `cbcbox` extra; 3.x bundles CBC (BUILD_PLAN §10)
    "groq>=1.7",  # imported only in app/llm/client.py (CLAUDE.md rule 6)
    "highspy>=1.13,<2",  # HiGHS MILP solver behind PuLP (approved 2026-10-09): the bundled Windows CBC hangs
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# Not an installable package: run from backend/ (`uv run python -m app.cli ...`), no build backend needed.
package = false

[tool.pytest.ini_options]
testpaths = ["app"]
addopts = "-ra --strict-markers -n auto"  # in parallel, one database per worker (conftest.py)
filterwarnings = [
    # Starlette suggests a different HTTP client package for TestClient; httpx is the approved one.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # PuLP 3.3 announces PuLP 4's variable API; we pin PuLP < 4 (CBC bundling, see dependencies)
    "ignore:Constructing LpVariable:DeprecationWarning",
]
markers = [
    "db: needs the db-test Postgres",
    "slow: slow tests",
    "live_llm: makes a real LLM call (opt-in: set RUN_LIVE_LLM_TESTS=1)",
    "with_margins: solver tests that keep the rounding margin inside the calorie limits",
    "solve_cache_off: always run the MILP (tests normally reuse the answer for an identical model)",
    "perf: wall-clock performance test under the production solver limits (opt-in: RUN_PERF_TESTS=1)",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*", "app/testing/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "DTZ", "PL"]
ignore = [
    "PLR0913",  # many arguments: explicit keyword args are clearer than bags of options here
    "PLR2004",  # magic values: tests and unit tables are full of literal numbers on purpose
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF001",   # unicode fractions (½ ⅓ ¼) are intentional in display strings
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Test functions are deliberately unannotated (pytest fixtures); the code they test is strict.
module = ["*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# PuLP ships no type information; the solver modules wrap it.
module = ["pulp", "pulp.*"]
ignore_missing_imports = true
