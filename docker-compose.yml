services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealbro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealbro}
      POSTGRES_DB: ${POSTGRES_DB:-mealbro}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealbro} -d ${POSTGRES_DB:-mealbro}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Throwaway database for pytest: data lives in RAM and disappears on restart.
  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: mealbro
      POSTGRES_PASSWORD: mealbro
      POSTGRES_DB: mealbro_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealbro -d mealbro_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mealbro}:${POSTGRES_PASSWORD:-mealbro}@db:5432/${POSTGRES_DB:-mealbro}
      TEST_DATABASE_URL: postgresql+psycopg://mealbro:mealbro@db-test:5432/mealbro_test
      USDA_RAW_DIR: /data/raw/usda
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # LLM settings come from the repo's .env (compose substitutes them; the container can't read .env itself)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # The ideas pass's model (2b.3b approval, P5: about 2x faster than 120b with the same pass rate). Set
      # LLM_IDEAS_MODEL in .env to change it, or leave it empty there to use LLM_MODEL.
      LLM_IDEAS_MODEL: ${LLM_IDEAS_MODEL-openai/gpt-oss-20b}
      LLM_STRUCTURED_MODE: ${LLM_STRUCTURED_MODE:-strict}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-low}  # empty in .env = a model without the setting
      # Sign-in (Phase 2): make both with `python -m app.cli hash-password` and put them in .env.
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Plain http on your home Wi-Fi: a Secure cookie would never be sent back. The cloud deploy uses https.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - backend-venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy
    command: ["uv", "run", "--frozen", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # The PWA (Phase 2): Next.js dev server; /api and /health are proxied to the backend, so the browser sees one
  # origin. Open http://<this PC's LAN address>:3000 on your phone (docs/deploy.md, "On your phone at home").
  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000
      WATCHPACK_POLLING: "true"  # file changes from a Windows bind mount
      DEV_ALLOWED_ORIGINS: ${DEV_ALLOWED_ORIGINS:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  backend-venv:
  frontend-node-modules:
  frontend-next:
